name: Lume quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lume_test
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lume_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lume_test:local_fixture_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:sql
        working-directory: backend
      - run: npm run test:sql -- --legacy-schema
        working-directory: backend
      - run: npm run test:sql -- --extensions-schema
        working-directory: backend
      - run: npm run test:sql -- --legacy-schema --extensions-schema
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
